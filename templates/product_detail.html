<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} | ShopEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #333;
        }

        header {
            background: #168447;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
        }

        .product-image {
            flex: 1;
            min-width: 250px;
            text-align: center;
        }

        .product-image img {
            width: 100%;
            max-width: 350px;
            height: 300px;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
            min-width: 250px;
        }

        .product-info h1 {
            color: #168447;
            margin-bottom: 20px;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            margin: 20px 0;
        }

        .stock {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #168447;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #106b37;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #168447;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h2>ShopEase</h2>
    <a href="{% url 'home' %}">← Home</a>
</header>

<div class="container">

    <div class="product-image">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
            <h1>🛒</h1>
        {% endif %}
    </div>

    <div class="product-info">

        <h1>{{ product.name }}</h1>

        <p>{{ product.description }}</p>

        <div class="price">
            ₹{{ product.price }}
        </div>

        <p class="stock">
            Available Stock: {{ product.stock }}
        </p>

        {% if product.stock > 0 %}
            <form method="POST"
                  action="{% url 'add_to_cart' product.id %}">
                {% csrf_token %}
                <button type="submit" class="btn">
                    Add to Cart 🛒
                </button>
            </form>
        {% else %}
            <p>Out of Stock</p>
        {% endif %}

        <a href="{% url 'home' %}" class="back">
            ← Continue Shopping
        </a>

    </div>

</div>

</body>
</html>
